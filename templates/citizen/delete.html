<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Citizen - JanSeva</title>


    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            margin: 0;
            background: #f4f7fb;
        }


        .header {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 25px;
        }


        .header h1 {
            margin-bottom: 8px;
        }


        .container {
            width: 90%;
            max-width: 600px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            text-align: center;
        }


        .warning {
            font-size: 55px;
            margin-bottom: 15px;
        }


        h2 {
            color: #dc3545;
            margin-bottom: 15px;
        }


        .message {
            color: #555;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
        }


        .citizen-name {
            font-weight: bold;
            color: #123c69;
        }


        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }


        .delete-confirm {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }


        .delete-confirm:hover {
            background: #bb2d3b;
        }


        .cancel-btn {
            background: #6c757d;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
        }


        .cancel-btn:hover {
            background: #5a6268;
        }


        @media (max-width: 600px) {

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>JanSeva</h1>

    <p>Citizen Service Management System</p>

</div>



<!-- DELETE CONFIRMATION -->

<div class="container">


    <div class="warning">

        ⚠️

    </div>


    <h2>Delete Citizen?</h2>


    <div class="message">

        Are you sure you want to delete the citizen:

        <br><br>

        <span class="citizen-name">

            {{ citizen.full_name }}

        </span>

        <br>

        Citizen ID:

        <strong>{{ citizen.id }}</strong>

        <br><br>

        This action cannot be undone.

    </div>



    <div class="buttons">


        <!-- CONFIRM DELETE -->

        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="delete-confirm">

                Yes, Delete

            </button>

        </form>


        <!-- CANCEL -->

        <a
            href="{% url 'citizen_list' %}"
            class="cancel-btn">

            Cancel

        </a>


    </div>


</div>


</body>

</html>
